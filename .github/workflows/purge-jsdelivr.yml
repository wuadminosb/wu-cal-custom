name: Purge jsdelivr cache

on:
  push:
    branches:
      - main
      - fix/jsdelivr-cache-purge
      - feature/sitzungssaele-3-6-room-details
      - feature/event-spaces-room-details
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge-jsdelivr:
    runs-on: ubuntu-latest
    steps:
      - name: Purge loader and room-details cache
        shell: bash
        run: |
          set -euo pipefail

          urls=(
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-osb-loader.js"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-osb-loader-v4.js?v=20260827-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-osb-loader-v5.js?v=20260827-2"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-osb-loader-v6.js?v=20260827-3"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom.css?v=20260827-3"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-short-internal-profile.js?v=20260827-2"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details.js?v=20260827-2"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-3-6.js?v=20260827-2"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces-data-festsaal-1.js?v=20260827-2"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces-data-festsaal-2.js?v=20260827-2"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces-data-galerie.js?v=20260827-2"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces-data-clubraum.js?v=20260827-2"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces-data-sky-lounge.js?v=20260827-2"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces-data-foyer.js?v=20260827-2"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces-data-tc-hall.js?v=20260827-2"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces.js?v=20260827-2"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-osb-loader-v7.js?v=20260828-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-summary-dashboard.js?v=20260828-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-confirmation.js?v=20260828-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/assets/icons/seminarraum.svg?v=20260828-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/assets/icons/hoersaal.svg?v=20260828-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/assets/icons/besprechungsraum.svg?v=20260828-1"
          )

          for url in "${urls[@]}"; do
            echo "Purging: ${url}"
            curl --fail --silent --show-error --location "${url}"
            echo
          done
