name: Purge jsDelivr cache

on:
  push:
    branches:
      - main
      - fix/jsdelivr-cache-purge
      - feature/sitzungssaele-3-6-room-details
      - feature/eventraeume-room-details
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge-jsdelivr:
    runs-on: ubuntu-latest
    steps:
      - name: Purge loader and room-details cache
        shell: bash
        run: |
          set -euo pipefail

          urls=(
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-osb-loader.js"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details.js?v=20260826-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-3-6.js?v=20260826-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces-loader.js?v=20260826-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces-data-lc-core.js?v=20260826-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces-data-lc-extra.js?v=20260826-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces-data-ea.js?v=20260826-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces-data-tc.js?v=20260826-1"
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/wu-cal-custom-room-details-event-spaces.js?v=20260826-1"
          )

          for url in "${urls[@]}"; do
            echo "Purging: ${url}"
            curl --fail --silent --show-error --location "${url}"
            echo
          done
